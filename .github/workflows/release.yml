name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a test build (no GitHub release is created)
        required: false
        default: 0.0.0-dev

permissions:
  contents: write # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26 # arm64, macOS 26 SDK (needed for NSGlassEffectView); x86_64 is cross-compiled
    timeout-minutes: 20
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion = git rev-list --count HEAD

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not MAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          {
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
            echo "ZIP=Forever-Note-$VERSION.zip"
          } >> "$GITHUB_ENV"

      - name: Build universal app (ad-hoc signed)
        run: UNIVERSAL=1 CODESIGN_IDENTITY=- VERSION="$VERSION" ./build.sh

      - name: Verify bundle
        run: |
          APP="build/Forever Note.app"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep '^Signature=adhoc'
          archs="$(lipo -archs "$APP/Contents/MacOS/ForeverNote")"; echo "archs: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::not universal: $archs"; exit 1; }
          got="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          [ "$got" = "$VERSION" ] || { echo "::error::Info.plist version $got != $VERSION"; exit 1; }

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/$ZIP"
          # Round-trip: the signature must survive zip/unzip.
          tmp="$(mktemp -d)"
          ditto -x -k "dist/$ZIP" "$tmp"
          codesign --verify --strict --deep --verbose=2 "$tmp/Forever Note.app"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Forever-Note-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Forever Note $VERSION" \
            "${flags[@]}" \
            "dist/$ZIP" "dist/$ZIP.sha256"
